name: jungle-financial
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: local_development_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local_admin_password
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 5s
      retries: 40
  api:
    build: .
    environment: &app_environment
      DATABASE_URL: postgres://financial:local_development_password@postgres:5432/financial?sslmode=disable
      HTTP_ADDRESS: :8080
      OIDC_ISSUER: http://localhost:8081/realms/jungle
      OIDC_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
      OIDC_AUDIENCE: financial-api
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      localstack: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    stop_grace_period: 35s
  api2:
    profiles: ["multi"]
    build: .
    environment: *app_environment
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      localstack: {condition: service_healthy}
    ports: ["127.0.0.1:8082:8080"]
    stop_grace_period: 35s
  api3:
    profiles: ["multi"]
    build: .
    environment: *app_environment
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      localstack: {condition: service_healthy}
    ports: ["127.0.0.1:8083:8080"]
    stop_grace_period: 35s
volumes:
  postgres_data:
